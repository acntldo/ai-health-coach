<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the layout reach the notch and home bar, css keeps content clear of them -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Chat with a health coach, log what you eat and track your daily calories." />
    <meta name="theme-color" content="#2f6f4f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2f7a54" media="(prefers-color-scheme: dark)" />
    <title>AI Health Coach</title>
    <script>
      // applies a saved theme before the first paint, so there is no flash
      try {
        var saved = localStorage.getItem('theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
