server {
  listen 80;
  root /usr/share/nginx/html;

  # the browser only talks to this server, which hands api calls to the backend container
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    # a chat message can take a while when the model is busy
    proxy_read_timeout 70s;
  }

  location / {
    # unknown paths go to index.html so refreshing a page works
    try_files $uri /index.html;
  }
}